[[items]]
title = "Permafrost Distribution and Degradation in Southeastern Tibet"
subtitle = "National Natural Science Foundation of China · Participant"
date = "In progress"
content = """
**Full project:** Detection of Permafrost Distribution and Spatiotemporal Degradation Patterns in Southeastern Tibet Driven by Rock Glacier Inventory

- Developing a large-scale rock glacier inventory and a systematic inventorying workflow.
- Automating the classification of intact and relict rock glaciers.
- Providing a foundational database for detailed permafrost distribution mapping.
"""
