[[items]]
title = "Active Rock Glaciers on the Eastern Margin of the Hengduan Mountains"
subtitle = "National Natural Science Foundation of China · Participant"
date = "Completed"
content = """
**Full project:** Active Rock Glacier Detection and Instability Control Evaluation on the Eastern Margin of the Hengduan Mountains Based on Multi-Temporal SAR

- Processed Sentinel SAR data using SBAS-InSAR in GAMMA.
- Estimated rock glacier velocities and determined temporal activity states.
- Calculated annual mean velocities for rock glaciers across the study area.
"""
